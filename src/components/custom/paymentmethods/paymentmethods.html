<div data-fls-paymentmethods class="paymentMethods">
	<if condition="paymentState.cards.length">
		<ul class="paymentMethods__list" data-payment-list aria-label="Payment methods">
			<each loop="card in paymentState.cards">
				<include src="@components/custom/paymentmethodcard/paymentmethodcard.html"
					locals='{"card": [[JSON.stringify(card)]]}'></include>
			</each>
		</ul>
	</if>
	<else>
		<div class="paymentMethods__empty" data-payment-empty>
			<h3 class="paymentMethods__emptyTitle">No saved payment methods</h3>
			<p class="paymentMethods__description">Add a payment method to make future checkout easier.</p>
		</div>
		<ul class="paymentMethods__list" data-payment-list aria-label="Payment methods" hidden></ul>
	</else>
	<button class="accountButton paymentMethods__addButton" type="button" data-payment-toggle
		aria-expanded="[[paymentState.isFormExpanded]]" aria-controls="payment-method-form">Add payment method</button>
	<div class="paymentMethods__formPanel [[paymentState.isFormExpanded ? 'paymentMethods__formPanel--expanded' : '']]"
		data-payment-panel id="payment-method-form" aria-hidden="[[!paymentState.isFormExpanded]]" inert>
		<div class="paymentMethods__formContent">
			<!-- WP: remove data-ui-preview-form, use the gateway's form action/nonces, and replace the visual fields with its hosted fields. -->
			<form class="paymentMethods__form" data-payment-form data-ui-preview-form action="#" method="post" autocomplete="off" aria-labelledby="payment-method-title">
				<h3 class="paymentMethods__formTitle" id="payment-method-title">Add payment method</h3>
				<div class="paymentMethods__providerFields" data-payment-provider-fields>
					<div data-fls-accountfield class="accountField">
						<label class="accountField__label" for="payment-cardholder">Cardholder name</label>
						<div class="accountField__control">
							<input class="accountField__input" id="payment-cardholder" type="text" required maxlength="100" placeholder="Name on card" autocomplete="off">
						</div>
					</div>
					<div data-fls-accountfield class="accountField">
						<label class="accountField__label" for="payment-card-number">Card number</label>
						<div class="accountField__control">
							<input class="accountField__input" id="payment-card-number" type="text" required
								data-payment-mask="cardNumber" inputmode="numeric" maxlength="23" placeholder="0000 0000 0000 0000" autocomplete="off">
						</div>
					</div>
					<div class="paymentMethods__fieldRow">
						<div data-fls-accountfield class="accountField">
							<label class="accountField__label" for="payment-expiry">Expiry date</label>
							<div class="accountField__control">
								<input class="accountField__input" id="payment-expiry" type="text" required
									data-payment-mask="expiry" inputmode="numeric" maxlength="7" placeholder="MM / YY" autocomplete="off">
							</div>
						</div>
						<div data-fls-accountfield class="accountField">
							<label class="accountField__label" for="payment-cvc">Security code</label>
							<div class="accountField__control">
								<input class="accountField__input" id="payment-cvc" type="password" required
									data-payment-mask="securityCode" inputmode="numeric" maxlength="4" placeholder="CVC" autocomplete="off">
							</div>
						</div>
					</div>
				</div>
				<div class="paymentMethods__actions">
					<button class="accountButton paymentMethods__formButton" type="submit">Add card</button>
					<button class="accountButton paymentMethods__formButton paymentMethods__cancelButton" type="button" data-payment-cancel>Cancel</button>
				</div>
			</form>
		</div>
	</div>
	<dialog class="confirmationModal" data-payment-remove-dialog id="payment-remove-dialog"
		aria-labelledby="payment-remove-title" aria-describedby="payment-remove-description">
		<include src="@components/custom/confirmationmodal/confirmationmodal.html"
			locals='{"modal": {
				"id": "payment-remove", "title": "Remove payment method?",
				"description": "Are you sure you want to remove this payment method?",
				"cancelLabel": "Cancel", "cancelIsPrimary": false,
				"confirmLabel": "Remove"
			}}'></include>
	</dialog>
	<dialog class="confirmationModal" data-payment-default-dialog id="payment-default-dialog"
		aria-labelledby="payment-default-title" aria-describedby="payment-default-description">
		<include src="@components/custom/confirmationmodal/confirmationmodal.html"
			locals='{"modal": {
				"id": "payment-default", "title": "Make default payment method?",
				"description": "Are you sure you want to make this your default payment method?",
				"cancelLabel": "Cancel", "cancelIsPrimary": false,
				"confirmLabel": "Make default"
			}}'></include>
	</dialog>
</div>
