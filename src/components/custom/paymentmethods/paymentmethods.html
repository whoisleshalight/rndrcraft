<div data-fls-paymentmethods class="paymentMethods">
	<div class="paymentMethods__empty" data-payment-empty>
		<h3 class="paymentMethods__emptyTitle">No saved payment methods</h3>
		<p class="paymentMethods__description">Add a payment method to make future checkout easier.</p>
	</div>
	<!-- WP: render saved WooCommerce payment tokens in this list; toggle hidden on the list/empty state on the server. -->
	<ul class="paymentMethods__list" data-payment-list aria-label="Payment methods" hidden></ul>
	<button data-fls-buttons class="btn-2l paymentMethods__addButton" type="button" data-payment-toggle
		aria-expanded="false" aria-controls="payment-method-form">Add payment method</button>
	<div class="paymentMethods__formPanel" data-payment-panel id="payment-method-form" aria-hidden="true" inert>
		<div class="paymentMethods__formContent">
			<!-- WP: remove data-ui-preview-form, use the gateway's form action/nonces, and replace the visual fields with its hosted fields. -->
			<form class="paymentMethods__form" data-payment-form data-ui-preview-form action="#" method="post" autocomplete="off" aria-labelledby="payment-method-title">
				<h3 class="paymentMethods__formTitle" id="payment-method-title">Add payment method</h3>
				<div class="paymentMethods__providerFields" data-payment-provider-fields>
					<div data-fls-accountfield class="accountField">
						<label class="accountField__label" for="payment-cardholder">Cardholder name</label>
						<div class="accountField__control">
							<input class="accountField__input" id="payment-cardholder" type="text" required maxlength="100" placeholder="Name on card" autocomplete="off">
						</div>
					</div>
					<div data-fls-accountfield class="accountField">
						<label class="accountField__label" for="payment-card-number">Card number</label>
						<div class="accountField__control">
							<input class="accountField__input" id="payment-card-number" type="text" required
								data-payment-mask="cardNumber" inputmode="numeric" maxlength="23" placeholder="0000 0000 0000 0000" autocomplete="off">
						</div>
					</div>
					<div class="paymentMethods__fieldRow">
						<div data-fls-accountfield class="accountField">
							<label class="accountField__label" for="payment-expiry">Expiry date</label>
							<div class="accountField__control">
								<input class="accountField__input" id="payment-expiry" type="text" required
									data-payment-mask="expiry" inputmode="numeric" maxlength="7" placeholder="MM / YY" autocomplete="off">
							</div>
						</div>
						<div data-fls-accountfield class="accountField">
							<label class="accountField__label" for="payment-cvc">Security code</label>
							<div class="accountField__control">
								<input class="accountField__input" id="payment-cvc" type="password" required
									data-payment-mask="securityCode" inputmode="numeric" maxlength="4" placeholder="CVC" autocomplete="off">
							</div>
						</div>
					</div>
				</div>
				<div class="paymentMethods__actions">
					<button data-fls-buttons class="btn-2l paymentMethods__formButton" type="submit">Add card</button>
					<button data-fls-buttons class="btn-2l paymentMethods__formButton paymentMethods__cancelButton" type="button" data-payment-cancel>Cancel</button>
				</div>
			</form>
		</div>
	</div>
	<!-- WP: render real masked token metadata. Set data-payment-token-id and use nonce-protected WooCommerce action links with the same data-payment-action attributes. -->
	<template data-payment-card-template>
		<li class="paymentMethods__card" data-payment-token-id="">
			<div class="paymentMethods__cardHeader">
				<h3 class="paymentMethods__cardTitle">Visa &#8226;&#8226;&#8226;&#8226; 4242</h3>
				<span class="paymentMethods__defaultBadge" data-payment-default-badge>Default</span>
			</div>
			<p class="paymentMethods__description">Expires 08/2028</p>
			<div class="paymentMethods__cardActions">
				<button class="paymentMethods__textButton" type="button" data-payment-action="default" data-payment-action-url="" hidden>Make default</button>
				<button class="paymentMethods__textButton" type="button" data-payment-action="remove" data-payment-action-url="">Remove</button>
			</div>
		</li>
	</template>
	<dialog class="paymentMethods__confirmation" data-payment-remove-dialog
		aria-labelledby="payment-remove-title" aria-describedby="payment-remove-description">
		<h2 class="paymentMethods__confirmationTitle" id="payment-remove-title">Remove payment method?</h2>
		<p class="paymentMethods__description" id="payment-remove-description">Are you sure you want to remove this payment method?</p>
		<div class="paymentMethods__actions">
			<button data-fls-buttons class="btn-2l paymentMethods__formButton paymentMethods__cancelButton"
				type="button" data-payment-remove-cancel data-payment-dialog-cancel autofocus>Cancel</button>
			<!-- Confirm emits paymentMethodConfirm; the supplied WooCommerce URL runs unless an AJAX adapter prevents the event. -->
			<button data-fls-buttons class="btn-2l paymentMethods__formButton"
				type="button" data-payment-remove-confirm data-payment-dialog-confirm>Remove</button>
		</div>
	</dialog>
	<dialog class="paymentMethods__confirmation" data-payment-default-dialog
		aria-labelledby="payment-default-title" aria-describedby="payment-default-description">
		<h2 class="paymentMethods__confirmationTitle" id="payment-default-title">Make default payment method?</h2>
		<p class="paymentMethods__description" id="payment-default-description">Are you sure you want to make this your default payment method?</p>
		<div class="paymentMethods__actions">
			<button data-fls-buttons class="btn-2l paymentMethods__formButton paymentMethods__cancelButton"
				type="button" data-payment-dialog-cancel autofocus>Cancel</button>
			<!-- Confirm emits paymentMethodConfirm; the supplied WooCommerce URL runs unless an AJAX adapter prevents the event. -->
			<button data-fls-buttons class="btn-2l paymentMethods__formButton"
				type="button" data-payment-dialog-confirm>Make default</button>
		</div>
	</dialog>
</div>
