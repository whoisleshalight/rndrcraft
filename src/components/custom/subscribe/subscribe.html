<section class="subscribe">

	<div class="subscribe__body _banner-bg">
	<picture>
		<source media="(max-width: 575.98px)" srcset="@img/home/subscribe/bg.jpg">
		<source media="(max-width: 767.98px)" srcset="@img/home/subscribe/bg.jpg">
		<source media="(max-width: 991.98px)" srcset="@img/home/subscribe/bg.jpg">
		<source media="(max-width: 1279.98px)" srcset="@img/home/subscribe/bg.jpg">
		<source media="(max-width: 1439.98px)" srcset="@img/home/subscribe/bg.jpg">
		<source media="(max-width: 1599.98px)" srcset="@img/home/subscribe/bg.jpg">
		<source media="(max-width: 1919.98px)" srcset="@img/home/subscribe/bg.jpg">
		<img class="subscribe__bg" src="@img/home/subscribe/bg.jpg" alt="image">
	</picture>
		<div class="subscribe__container">
			<div class="subscribe__info info-subscribe">
				<div class="info-subscribe__logo _logo-banner">
					<img src="@img/logo-white.svg" alt="Image">
				</div>
				<div class="info-subscribe__body">
					<h3 class="info-subscribe__title _title-banner">Subscribe to be on mind!</h3>
					<form class="info-subscribe__form form-subscribe" action="#" data-fls-subscribe>
						<div class="form-subscribe__item">
							<label for="subscribe" class="form-subscribe__label">Subscribe to be on mind</label>
							<div class="form-subscribe__action">
								<input id="subscribe" autocomplete="off" type="text" name="subscribe"
									data-error="Email address is invalid!" placeholder="YOUR EMAIL" class="input _typed">
								<button type="submit" class="button btn-m">Subscribe</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</section>
