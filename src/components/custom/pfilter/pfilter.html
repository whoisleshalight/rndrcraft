<div data-fls-pfilter class="pfilter pfilter-radio" data-pfilter-type="radio">
	<button type="button" class="pfilter__button">
		<span>Categories</span>
		<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
			<path d="M19 15L12.7809 9.66939C12.3316 9.2842 11.6684 9.2842 11.2191 9.66939L5 15" stroke-width="3"
				stroke-linecap="round" stroke="#CAF749" />
		</svg>
	</button>
	<div class="pfilter__menu">
		<form class="pfilter__form">
			<div class="pfilter__header header-pfilter">
				<div class="header-pfilter__body">
					<div class="header-pfilter__title">Sort by</div>
					<div class="header-pfilter__info">Choose an option</div>
				</div>
				<!-- <div class="header-pfilter__actions">
					<button type="button" class="header-pfilter__button">Clear</button>
				</div> -->
			</div>
			<div class="pfilter__content">
				<div class="options pfilter-radio">
					<div class="options__item">
						<input id="s_1" class="options__input" checked type="radio" value="1" name="option">
						<label for="s_1" class="options__label"><span class="options__text">Relevance</span></label>
					</div>
					<div class="options__item">
						<input id="s_2" class="options__input" type="radio" value="1" name="option">
						<label for="s_2" class="options__label"><span class="options__text">Best selling</span></label>
					</div>
					<div class="options__item">
						<input id="s_3" class="options__input" type="radio" value="1" name="option">
						<label for="s_3" class="options__label"><span class="options__text">Newest</span></label>
					</div>
					<div class="options__item">
						<input id="s_4" class="options__input" type="radio" value="1" name="option">
						<label for="s_4" class="options__label"><span class="options__text">Popular</span></label>
					</div>
					<div class="options__item">
						<input id="s_5" class="options__input" type="radio" value="1" name="option">
						<label for="s_5" class="options__label"><span class="options__text">Price: low to high</span></label>
					</div>
					<div class="options__item">
						<input id="o_6" class="options__input" type="radio" value="1" name="option">
						<label for="o_6" class="options__label"><span class="options__text">Price: high to low</span></label>
					</div>
				</div>
			</div>
			<!-- <div class="pfilter__footer footer-pfilter">
				<button type="button" class="footer-pfilter__button">
					Show results
					<span>30</span>
				</button>
			</div> -->
		</form>
	</div>
</div>
