<section data-fls-dashboardsection data-fls-accountlayout data-fls-background class="dashboardsection accountLayout accountLayout--dashboard _background" aria-labelledby="dashboard-title">
	<div class="accountLayout__container">
		<div class="accountLayout__grid">
			<include src="@components/custom/accountsidebar/accountsidebar.html"
				locals='{"currentPage":"dashboard","currentHref":"dashboard.html","currentLabel":"Dashboard","mobileLabel":"Menu","navigationId":"dashboard-navigation"}'></include>
			<div class="accountLayout__main dashboardsection__main">
				<include src="@components/custom/accountheading/accountheading.html"
					locals='{
						"variant": "dashboard",
						"titleId": "dashboard-title",
						"title": "Dashboard",
						"description": "Here’s an overview of your account and recent activity."
					}'>
				</include>
				<div class="dashboard-welcome">
					<div class="dashboard-welcome__content">
						<p class="dashboard-welcome__label">Welcome back</p>
						<p class="dashboard-welcome__name">Alex.</p>
					</div>
					<div class="dashboard-welcome__decoration" aria-hidden="true"><img src="@img/dashboard/welcome-mark.svg"
							alt="" width="170" height="157"></div>
				</div>
				<dl class="dashboard-stats" aria-label="Account overview">
					<div class="dashboard-stats__item">
						<dt class="dashboard-stats__label">Purchased products</dt>
						<dd class="dashboard-stats__value">6</dd>
					</div>
					<div class="dashboard-stats__item">
						<dt class="dashboard-stats__label">Total orders</dt>
						<dd class="dashboard-stats__value">3</dd>
					</div>
					<div class="dashboard-stats__item">
						<dt class="dashboard-stats__label">Recent purchase</dt>
						<dd class="dashboard-stats__value"><time datetime="2025-05-18">May 18</time></dd>
					</div>
				</dl>
				<div class="dashboard-purchases" role="group" aria-labelledby="dashboard-purchases-title">
					<div class="dashboardsection__section-heading">
						<h2 class="dashboardsection__section-title" id="dashboard-purchases-title">Recent purchases</h2>
						<a class="dashboardsection__view-all" href="downloads.html">View all downloads</a>
					</div>
					<ul class="dashboard-purchases__list">
						<each loop="purchase in [1, 2, 3]">
							<li class="dashboard-purchases__item">
								<include src="@components/custom/purchaseproduct/purchaseproduct.html"
									locals='{
										"variant": "dashboard",
										"productTitle": "Floating Phone Mockup",
										"productHref": "product-single.html",
										"imageSrc": "@img/dashboard/floating-phone.webp",
										"imageAlt": "Floating phone mockup on a dark background",
										"category": "Devices",
										"purchaseDate": "2025-05-18",
										"purchaseDateLabel": "May 18, 2025"
									}'>
								</include>
							</li>
						</each>
					</ul>
				</div>
				<div class="dashboard-orders" role="group" aria-labelledby="dashboard-orders-title">
					<div class="dashboardsection__section-heading">
						<h2 class="dashboardsection__section-title" id="dashboard-orders-title">Recent orders</h2>
						<a class="dashboardsection__view-all" href="orders.html">View all orders</a>
					</div>
					<include src="@components/custom/ordertable/ordertable.html"
						locals='{
							"variant": "dashboard",
							"tableId": "dashboard-orders",
							"caption": "Recent orders, dates, totals and payment status",
							"orders": [
								{
									"number": "RC-10241",
									"date": "2025-02-03",
									"formattedDate": "February 03, 2025",
									"total": "$24.00",
									"status": "Paid",
									"href": "order-details.html"
								},
								{
									"number": "RC-10241",
									"date": "2025-02-03",
									"formattedDate": "February 03, 2025",
									"total": "$24.00",
									"status": "Paid",
									"href": "order-details.html"
								},
								{
									"number": "RC-10241",
									"date": "2025-02-03",
									"formattedDate": "February 03, 2025",
									"total": "$24.00",
									"status": "Paid",
									"href": "order-details.html"
								}
							]
						}'>
					</include>
				</div>
			</div>
		</div>
	</div>
</section>
