<div data-fls-searchfield class="searchField searchField--[[size]]">
	<label class="searchField__label" for="[[inputId]]">[[label]]</label>
	<img class="searchField__icon" src="@img/search-field/search.svg" alt="" width="28" height="29">
	<input class="searchField__input" id="[[inputId]]" type="text" name="[[inputName]]" placeholder="[[placeholder]]"
		data-fls-input autocomplete="off" data-search-field-input>
	<button class="searchField__clear" type="button" aria-label="[[clearLabel]]" data-search-field-clear>
		<img class="searchField__clearIcon" src="@img/search-field/clear.svg" alt="" width="24" height="24">
	</button>
</div>
