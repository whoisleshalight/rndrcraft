 <head>
 	<if condition="'[[preloader.enable]]' === 'true'">
 		<include src="@components/effects/preloader/preloader.html" locals='{"once":"[[preloader.once]]"}'></include>
 	</if>
 	<meta charset="UTF-8" />
 	<meta name="viewport" content="width=device-width, initial-scale=1.0">
 	<include src="@components/layout/head/fonts-preload.html"></include>
 	<link rel="stylesheet" href="@styles/fonts/fonts.css">
 	<link rel="stylesheet" href="@styles/style.scss">
 	<link rel="shortcut icon" href="@img/favicon.ico">
 	<if condition="'[[keywords]]' !== ''">
 		<meta name="keywords" content="[[keywords]]">
 	</if>
 	<if condition="'[[description]]' !== ''">
 		<meta name="description" content="[[description]]">
 	</if>
 	<title>[[title]]</title>
 	<style>
 		html[data-fls-webpreloader-loading] {
 			overflow: hidden;
 		}

 		html[data-fls-webpreloader-loading] body {
 			overflow: hidden;
 		}

 		html:not(:has(.page--home)) body {
 			opacity: 0;
 		}

 		html[data-fls-loaded]:not(:has(.page--home)) body {
 			opacity: 1;
 		}

 		html:not([data-fls-loaded]) body {
 			overflow-y: hidden;
 		}

 		html:not([data-fls-loaded]) *:not(.webpreloader, .webpreloader *) {
 			transition: none !important;
 		}

 		.webpreloader {
 			position: fixed;
 			top: 0;
 			left: 0;
 			width: 100vw;
 			height: 100vh;
 			z-index: 9999;
 			display: flex;
 			flex-direction: column;
 		}

 		.webpreloader::before {
 			content: "";
 			position: fixed;
 			top: 0;
 			left: 0;
 			width: 100vw;
 			height: 100vh;
 			background-color: #000000;
 			opacity: 1;
 			transition: opacity 850ms ease-in-out;

 			[data-fls-loaded] & {}
 		}

 		[data-fls-loaded] .webpreloader::before {
 			opacity: 0;
 			/* visibility: hidden; */
 		}

		[data-fls-loaded] .webpreloader,
 		.webpreloader--loaded {
 			visibility: hidden;
 			transition: visibility 0s 850ms;
 		}

 		/* .webpreloader--loaded::before { */
 		/* opacity: 0; */
 		/* } */

 		.webpreloader .webpreloader__wrapper {
 			position: relative;
 			z-index: 2;
 			flex: 1 1 auto;
 			display: flex;
 			flex-direction: column;
 			background-color: #fff;
 			will-change: transform;
 			transition: transform 850ms cubic-bezier(0.76, 0, 0.24, 1);

 			[data-fls-loaded] & {
 				transform: translateY(-100%);
 			}
 		}

 		.webpreloader--loaded .webpreloader__wrapper {
 			/* transform: translateY(-100%); */
 		}

 		.webpreloader__main {
 			display: flex;
 			flex: 1 1 auto;
 			flex-direction: column;
 			align-items: center;
 			justify-content: center;
 		}

		.webpreloader__progress {
			position: relative;
			flex: 0 0 8px;
			width: 100%;
			height: 8px;
			overflow: hidden;
			background-color: #000;
		}

		.webpreloader__progressFill {
			position: absolute;
			inset: 0;
			display: block;
			background-color: #caf749;
			transform: scaleX(0);
			transform-origin: left center;
			transition: transform 200ms ease-out;
		}

		@media (prefers-reduced-motion: reduce) {
			.webpreloader__progressFill {
				transition: none;
			}
		}

 		.webpreloader__logo {
 			display: block;
 			width: 16vw;
 			max-width: calc(100% - 48px);
 			height: auto;
 			overflow: visible;transition: all 0.4s;
 			color: #000;
 		}
[data-fls-loaded] .webpreloader__logo {
	transform: translateY(-40px);opacity: 0;
}
 		.webpreloader__cube {}

 		.webpreloader__cube .webpreloader__cubePart:nth-child(1) {
 			transform: translate(20px, -20px);


 		}

 		.webpreloader__cube .webpreloader__cubePart:nth-child(2) {
 			transform: translate(-20px, 6px);

 		}

 		.webpreloader__cube .webpreloader__cubePart:nth-child(3) {}

 		.webpreloader__cube .webpreloader__cubePart:nth-child(4) {
 			transform: translate(-14px, -20px);


 		}

 		.webpreloader__cube .webpreloader__cubePart:nth-child(5) {
 			transform: translate(-8px, 20px);

 		}

 		.webpreloader__cube .webpreloader__cubePart:nth-child(6) {
 			transform: translate(20px, -8px);
 		}

 		.webpreloader__cube .webpreloader__cubePart:nth-child(7) {
 			transform: translate(20px, 20px);
 		}

 		.webpreloader__cube .webpreloader__cubePart {
 			opacity: 0;
 			transition: all 0.4s linear;
 			filter: blur(6px);

 			.load & {
 				opacity: 1;
 				transform: translate(0px, 0px);
 				filter: blur(0px);

 			}
 		}

 		.webpreloader__wordmark path:nth-child(1) {
 			transition: all 0.4s ease 0.1s;
 			transform: translateY(20px);

 		}

 		.webpreloader__wordmark path:nth-child(2) {
 			transition: all 0.4s ease 0.15s;
 			transform: translateY(-20px);

 		}

 		.webpreloader__wordmark path:nth-child(3) {
 			transition: all 0.4s ease 0.2s;
 			transform: translateY(20px);

 		}

 		.webpreloader__wordmark path:nth-child(4) {
 			transform: translateY(-20px);

 			transition: all 0.4s ease 0.25s;
 		}

 		.webpreloader__wordmark path:nth-child(5) {
 			transform: translateY(20px);

 			transition: all 0.4s ease 0.3s;
 		}

 		.webpreloader__wordmark path:nth-child(6) {
 			transform: translateY(-20px);

 			transition: all 0.4s ease 0.35s;
 		}

 		.webpreloader__wordmark path:nth-child(7) {
 			transition: all 0.4s ease 0.4s;
 			transform: translateY(20px);

 		}

 		.webpreloader__wordmark path:nth-child(8) {
 			transition: all 0.4s ease 0.45s;
 			transform: translateY(-20px);

 		}

 		.webpreloader__wordmark path:nth-child(9) {
 			transition: all 0.4s ease 0.5s;
 			transform: translateY(20px);

 		}

 		.webpreloader__wordmark path {
 			filter: blur(6px);
 			opacity: 0;

 			.load & {
 				opacity: 1;
 				transform: translate(0px, 0px);
 				filter: blur(0px);

 			}

 			/* path{ */
 			/*  */

 			/* } */
 		}


 		/* @media (prefers-reduced-motion: reduce) {
 			.webpreloader--loaded {
 				transition-delay: 0s;
 			}

 			.webpreloader--loaded .webpreloader__wrapper,
 			.webpreloader--loaded::before {
 				transition: none;
 			}

 			.webpreloader__wrapper {
 				will-change: auto;
 			}

 		} */


 		@media (max-width: 991.98px) {
 			.webpreloader__main svg {
 				width: 26vw;
 			}
 		}

 		@media (max-width: 575.98px) {
 			.webpreloader__main svg {
 				width: 50vw;
 			}
 		}
 	</style>

 </head>
